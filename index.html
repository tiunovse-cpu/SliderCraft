<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>SlideCraft Pro</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0f1115;--panel:#1a1d24;--panel-2:#232730;--accent:#6366f1;--accent-2:#8b5cf6;--text:#e5e7eb;--muted:#9ca3af;--border:#2d323d;--danger:#ef4444;--warn:#f59e0b;--success:#10b981}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;display:flex;flex-direction:column;user-select:none}
header{background:var(--panel);border-bottom:1px solid var(--border);padding:8px 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.logo{font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent-2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-size:14px}
.toolbar{display:flex;gap:4px;flex-wrap:wrap}
.tool-group{display:flex;gap:2px;padding:2px;background:var(--panel-2);border-radius:6px;border:1px solid var(--border)}
.tool-btn{background:transparent;color:#fff;border:none;border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;width:32px;height:32px;font-size:12px}
.tool-btn svg{width:20px;height:20px;fill:currentColor}
.tool-btn:hover{background:var(--border)}
.tool-btn.active,.tool-btn.drawing-active{background:var(--accent);color:#fff}
.tool-btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));width:auto;padding:0 12px;font-weight:600}
.tool-btn.txt{width:auto;padding:0 10px}
.spacer{flex:1}
.pen-icon{transform:rotate(45deg)}
.workspace{flex:1;display:flex;overflow:hidden}
.sidebar{width:190px;background:var(--panel);border-right:1px solid var(--border);padding:12px;display:flex;flex-direction:column}
.sidebar h3{font-size:11px;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.slide-thumb{border:2px solid transparent;border-radius:6px;margin-bottom:6px;cursor:pointer;position:relative;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--panel-2)}
.slide-thumb.active{border-color:var(--accent)}
.slide-thumb .num{position:absolute;top:3px;left:5px;font-size:9px;color:#fff;text-shadow:0 0 3px #000}
.slide-thumb .title{font-size:10px;color:#fff;text-shadow:0 0 3px #000;max-width:80%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slide-thumb .actions{position:absolute;top:3px;right:3px;display:flex;gap:3px;opacity:0}
.slide-thumb:hover .actions{opacity:1}
.thumb-btn{width:18px;height:18px;border-radius:4px;background:var(--panel);border:1px solid var(--border);color:var(--text);cursor:pointer;font-size:10px}
.thumb-btn:hover{background:var(--accent)}
.thumb-btn.del:hover{background:var(--danger)}
.add-slide-btn{width:100%;padding:8px;background:var(--panel-2);border:1px dashed var(--border);color:var(--muted);border-radius:6px;cursor:pointer;font-size:18px;margin-top:auto}
.add-slide-btn:hover{border-color:var(--accent);color:var(--accent)}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.canvas-wrap{flex:1;overflow:auto;padding:24px;display:flex;align-items:center;justify-content:center;background:#0a0b0f;background-image:radial-gradient(circle at 1px 1px,#1a1d24 1px,transparent 0);background-size:20px 20px}
.canvas-transform{transform-origin:center center}
.slide-canvas{background:#fff;color:#1a1d24;border-radius:8px;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.slide-canvas.ratio-16-9{width:960px;height:540px}.slide-canvas.ratio-4-3{width:960px;height:720px}.slide-canvas.ratio-16-10{width:960px;height:600px}
.element{position:absolute;cursor:move;outline:1px dashed transparent}
.slide-canvas .element:hover{outline-color:rgba(99,102,241,.6)}
.element.selected{outline:2px solid var(--accent)!important}
.element.multi-selected{outline:2px dashed var(--warn)!important}
.element.editing-shape{outline:2px solid var(--success)!important}
.element-content{width:100%;height:100%;position:relative;transform-origin:center center;overflow:hidden}
.text-el{padding:8px;word-wrap:break-word;white-space:pre-wrap;min-height:20px}
.text-el[contenteditable="true"]{cursor:text;caret-color:var(--accent);outline:2px solid var(--accent);outline-offset:-2px}
.element-content svg{width:100%;height:100%;display:block;overflow:visible}
.resize-handle{position:absolute;width:10px;height:10px;background:var(--accent);border:2px solid #fff;border-radius:50%;z-index:10}
.resize-handle.nw{top:-5px;left:-5px;cursor:nwse-resize}.resize-handle.ne{top:-5px;right:-5px;cursor:nesw-resize}
.resize-handle.sw{bottom:-5px;left:-5px;cursor:nesw-resize}.resize-handle.se{bottom:-5px;right:-5px;cursor:nwse-resize}
.rotate-handle{position:absolute;top:-26px;left:50%;transform:translateX(-50%);width:12px;height:12px;background:var(--warn);border:2px solid #fff;border-radius:50%;z-index:10;cursor:grab}
.node{position:absolute;width:11px;height:11px;background:var(--warn);border:2px solid #fff;border-radius:50%;z-index:20;cursor:move;transform:translate(-50%,-50%)}
.node.rounded{background:var(--success)}
.node.sel{background:var(--danger);transform:translate(-50%,-50%) scale(1.35)}
.properties{width:300px;background:var(--panel);border-left:1px solid var(--border);overflow-y:auto;padding:14px}
.properties h3{font-size:11px;text-transform:uppercase;color:var(--muted);margin:12px 0 8px}
.properties h3:first-child{margin-top:0}
.prop-row{display:flex;align-items:center;gap:6px;margin-bottom:6px;font-size:12px;flex-wrap:wrap}
.prop-row label{color:var(--muted);min-width:74px;font-size:11px}
.prop-row input,.prop-row select,.prop-row textarea{flex:1;background:var(--panel-2);color:var(--text);border:1px solid var(--border);border-radius:4px;padding:4px 6px;font-size:12px;min-width:0}
.prop-row input[type=color]{width:32px;height:26px;padding:2px;flex:0 0 32px;cursor:pointer}
.prop-row input[type=number]{width:62px;flex:0 0 62px}
.prop-row input[type=checkbox]{width:16px;height:16px;flex:0 0 16px;margin:0;cursor:pointer}
.hint{font-size:10px;color:var(--muted);margin-top:6px;line-height:1.45}
.btn{background:var(--panel-2);color:var(--text);border:1px solid var(--border);border-radius:4px;padding:6px;cursor:pointer;font-size:12px;width:100%;text-align:center}
.btn:hover{background:var(--border)}
.btn.acc{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.dgr{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.on{background:var(--success);border-color:var(--success);color:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.layer-item{display:flex;gap:4px;padding:4px 6px;background:var(--panel-2);border:1px solid var(--border);border-radius:4px;margin-bottom:3px;font-size:11px;cursor:pointer}
.layer-item.active{border-color:var(--accent)}
.layer-item .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-bar{background:var(--panel);border-top:1px solid var(--border);padding:8px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.nav-btn{width:32px;height:32px;display:flex;align-items:center;justify-content:center;background:var(--panel-2);border:1px solid var(--border);color:var(--text);border-radius:6px;cursor:pointer}
.counter{font-size:13px;color:var(--muted)}
.zoom-info{font-size:11px;color:var(--muted);padding:4px 8px;background:var(--panel-2);border-radius:4px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:2000}
.modal.active{display:flex}
.modal-content{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:20px;max-width:680px;width:92%;max-height:86vh;overflow-y:auto}
.modal h2{font-size:16px;margin-bottom:12px}
.modal textarea{width:100%;min-height:110px;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:10px;font-family:monospace;font-size:13px}
.modal-actions{display:flex;gap:6px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.modal-actions button{background:var(--panel-2);color:var(--text);border:1px solid var(--border);border-radius:4px;padding:6px 12px;cursor:pointer;font-size:12px}
.modal-actions button.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));border:none;color:#fff}
.data-table{width:100%;border-collapse:collapse;margin:10px 0;font-size:12px}
.data-table th,.data-table td{padding:4px;border:1px solid var(--border)}
.data-table input{width:100%;background:transparent;border:none;color:var(--text);font-size:12px}
.symbols{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin:8px 0}
.symbols button{background:var(--panel-2);border:1px solid var(--border);color:var(--text);padding:7px;border-radius:4px;cursor:pointer;font-size:15px;font-family:serif}
.symbols button:hover{background:var(--accent);color:#fff}
.ftabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.ftab{background:var(--panel-2);border:1px solid var(--border);color:var(--text);padding:5px 9px;border-radius:4px;cursor:pointer;font-size:11px}
.ftab.active{background:var(--accent);border-color:var(--accent);color:#fff}
.flist{display:grid;grid-template-columns:1fr 1fr;gap:6px;max-height:320px;overflow-y:auto}
.fitem{background:var(--panel-2);border:1px solid var(--border);color:var(--text);padding:8px;border-radius:4px;cursor:pointer;text-align:left;font-size:12px}
.fitem:hover{background:var(--accent);color:#fff}
.fitem span{display:block;font-size:10px;color:var(--muted);margin-top:3px;font-family:monospace}
.fitem:hover span{color:rgba(255,255,255,.85)}
.anim-step{background:var(--panel-2);border:1px solid var(--border);border-radius:6px;padding:8px;margin-bottom:6px;font-size:11px}
.anim-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.anim-ctrl{display:flex;gap:2px;margin-right:auto}
.anim-ctrl button{width:22px;height:22px;border-radius:4px;background:var(--panel);border:1px solid var(--border);color:var(--muted);cursor:pointer;font-size:10px}
.anim-ctrl button:hover{background:var(--accent);color:#fff}
.anim-ctrl button.d:hover{background:var(--danger)}
.anim-num{width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:bold}
.notice{background:rgba(245,158,11,.1);border:1px dashed var(--warn);color:var(--warn);padding:8px;border-radius:4px;font-size:11px;text-align:center}
.table-el table{width:100%;height:100%;border-collapse:collapse;table-layout:fixed}
.table-el td{padding:4px 6px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;vertical-align:middle;transition:background .15s}
.table-el td.rh,.table-el td.ch{background:rgba(99,102,241,.13)!important}
.table-el td.hov{background:rgba(99,102,241,.28)!important}
.table-el td.sel{outline:2px solid var(--warn);outline-offset:-2px}
.table-el td[contenteditable=true]{outline:2px solid var(--accent);outline-offset:-2px;cursor:text}
.btn-el{display:flex;align-items:center;justify-content:center;width:100%;height:100%;border:none;cursor:pointer;font-weight:600}
.blur-bg{backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:8px}
.presentation-mode{position:fixed;inset:0;background:#000;z-index:1000;display:none;align-items:center;justify-content:center}
.presentation-mode.active{display:flex}
.pres-slide{background:#fff;color:#1a1d24;position:relative;overflow:hidden}
.pres-slide.ratio-16-9{width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh}
.pres-slide.ratio-4-3{width:100vw;height:75vw;max-height:100vh;max-width:133.33vh}
.pres-slide.ratio-16-10{width:100vw;height:62.5vw;max-height:100vh;max-width:160vh}
.pres-btn{position:absolute;top:18px;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.2);color:#fff;width:38px;height:38px;border-radius:50%;cursor:pointer;z-index:12}
.pres-btn.fs{left:18px}.pres-btn.cl{right:18px}
.pres-nav{position:absolute;bottom:18px;right:18px;display:flex;gap:8px;align-items:center;background:rgba(0,0,0,.45);padding:6px 12px;border-radius:24px;z-index:12}
.magnifier{position:fixed;width:230px;height:230px;border-radius:50%;border:4px solid var(--accent);overflow:hidden;pointer-events:none;z-index:9999;display:none;background:#fff}
.magnifier.active{display:block}.magnifier-inner{position:absolute;transform-origin:0 0}
.drawing-cursor{cursor:crosshair!important}
.watermark{position:fixed;bottom:10px;right:14px;font-size:12px;color:var(--muted);opacity:.45;z-index:500;font-family:monospace;display:flex;gap:10px;align-items:center}
.watermark:hover{opacity:1}
.watermark a{text-decoration:none;color:inherit}
.donate{background:var(--success);color:#fff!important;padding:4px 10px;border-radius:4px;font-weight:600;opacity:1}
/* Toast-уведомления */
.toast-stack{position:fixed;bottom:20px;left:20px;z-index:6000;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:360px}
.toast{background:var(--panel);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:6px;padding:10px 14px;color:var(--text);font-size:12px;box-shadow:0 8px 24px rgba(0,0,0,.4);pointer-events:auto;display:flex;align-items:center;gap:10px;animation:toastIn .3s ease}
.toast.success{border-left-color:var(--success)}
.toast.warn{border-left-color:var(--warn)}
.toast.error{border-left-color:var(--danger)}
.toast .spinner-sm{width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;flex-shrink:0}
.toast .toast-title{font-weight:600;margin-bottom:2px;font-size:12px}
.toast .toast-msg{color:var(--muted);font-size:11px;line-height:1.4}
@keyframes toastIn{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:translateX(0)}}
@keyframes toastOut{to{opacity:0;transform:translateX(-20px)}}
.loading{position:fixed;inset:0;background:rgba(10,11,15,.78);z-index:5000;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px}
.loading.active{display:flex}
.spinner{width:52px;height:52px;border:5px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:13px;color:var(--text)}
.pixel-rain{position:absolute;inset:0;z-index:30;pointer-events:none;overflow:hidden}
.pixel-rain i{position:absolute;display:block;animation:pfall .85s cubic-bezier(.4,.1,.7,1) forwards}
@keyframes pfall{0%{transform:translateY(0) scale(1);opacity:1}100%{transform:translateY(320px) scale(.55);opacity:0}}
/* ===== TRANSITION OVERLAYS ===== */
.t-overlay{position:absolute;inset:0;z-index:40;pointer-events:none;overflow:hidden}
.t-pixel-switch canvas{width:100%;height:100%;image-rendering:pixelated}
.t-noise{background:repeating-linear-gradient(0deg,#000 0,#fff 1px,#000 2px,#888 3px);animation:noiseShift .1s steps(2) infinite;mix-blend-mode:overlay}
@keyframes noiseShift{0%{transform:translate(0,0)}25%{transform:translate(-2%,1%)}50%{transform:translate(1%,-1%)}75%{transform:translate(-1%,2%)}100%{transform:translate(2%,-2%)}}
.t-bsod{background:#0078d7;color:#fff;font-family:'Consolas','Courier New',monospace;padding:8%;font-size:clamp(10px,1.6vw,20px);line-height:1.5;animation:bsodFlash 1.1s ease forwards}
@keyframes bsodFlash{0%{opacity:0}10%{opacity:1}85%{opacity:1}100%{opacity:0}}
.t-crack{background:radial-gradient(circle at 50% 45%,transparent 0,transparent 100%),conic-gradient(from 0deg at 50% 45%,#000 0deg,transparent 8deg,#000 16deg,transparent 24deg,#000 32deg,transparent 40deg,#000 48deg,transparent 56deg,#000 64deg,transparent 72deg,#000 80deg,transparent 88deg,#000 96deg,transparent 104deg,#000 112deg,transparent 120deg,#000 128deg,transparent 136deg,#000 144deg,transparent 152deg,#000 160deg,transparent 168deg,#000 176deg,transparent 184deg,#000 192deg,transparent 200deg,#000 208deg,transparent 216deg,#000 224deg,transparent 232deg,#000 240deg,transparent 248deg,#000 256deg,transparent 264deg,#000 272deg,transparent 280deg,#000 288deg,transparent 296deg,#000 304deg,transparent 312deg,#000 320deg,transparent 328deg,#000 336deg,transparent 344deg,#000 352deg,transparent 360deg);animation:crackGrow .9s ease forwards}
@keyframes crackGrow{0%{opacity:0;transform:scale(.6)}30%{opacity:1;transform:scale(1)}100%{opacity:1;transform:scale(1)}}
.t-shatter{position:absolute;inset:0;z-index:41;pointer-events:none}
.t-shard{position:absolute;background:inherit;box-shadow:0 0 4px rgba(0,0,0,.4);animation:shardFall 1s cubic-bezier(.3,.6,.5,1) forwards}
@keyframes shardFall{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:0}}
.t-repair{position:absolute;inset:0;z-index:42;pointer-events:none;background:#0a0b0f;display:flex;align-items:center;justify-content:center;animation:repairSwap 1.4s ease forwards}
.t-repair .pcb{width:80%;height:70%;background:repeating-linear-gradient(45deg,#0f5132 0,#0f5132 6px,#1a7a4a 6px,#1a7a4a 12px);border:3px solid #2c3e50;border-radius:8px;position:relative;box-shadow:inset 0 0 30px rgba(0,0,0,.6)}
.t-repair .pcb::before,.t-repair .pcb::after{content:'';position:absolute;background:#f1c40f;border-radius:2px}
.t-repair .pcb::before{width:30%;height:12%;top:15%;left:10%}
.t-repair .pcb::after{width:20%;height:20%;bottom:12%;right:12%}
.t-repair .screen{position:absolute;inset:0;background:#111;border:6px solid #333;border-radius:10px;transform:translateY(-120%);animation:screenDrop 1.4s ease forwards}
@keyframes repairSwap{0%{opacity:0}15%{opacity:1}85%{opacity:1}100%{opacity:0}}
@keyframes screenDrop{0%{transform:translateY(-120%)}40%{transform:translateY(-120%)}75%{transform:translateY(0)}100%{transform:translateY(0)}}
.t-rain{position:absolute;inset:0;z-index:43;pointer-events:none;overflow:hidden}
.t-drop{position:absolute;width:3px;height:18px;background:linear-gradient(to bottom,rgba(255,255,255,.9),rgba(120,180,255,.4));border-radius:0 0 3px 3px;filter:drop-shadow(0 0 2px rgba(120,180,255,.6));animation:dropFall var(--dur) linear forwards}
@keyframes dropFall{0%{transform:translateY(-20px);opacity:0}10%{opacity:1}100%{transform:translateY(var(--fall));opacity:0}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes slideLeft{from{transform:translateX(100%)}to{transform:translateX(0)}}
@keyframes slideRight{from{transform:translateX(-100%)}to{transform:translateX(0)}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes slideDown{from{transform:translateY(-100%)}to{transform:translateY(0)}}
@keyframes zoom{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes flip{from{transform:rotateY(90deg)}to{transform:rotateY(0)}}
@keyframes pixelAssemble{0%{clip-path:inset(0 100% 0 0);opacity:.2}100%{clip-path:inset(0 0 0 0);opacity:1}}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
#printArea{display:none}
@media print{body *{visibility:hidden}#printArea,#printArea *{visibility:visible}#printArea{display:block!important;position:absolute;left:0;top:0}.pslide{page-break-after:always;position:relative;overflow:hidden}}
</style>
</head>
<body>
<header>
<div class="logo">🎨 SlideCraft Pro</div>
<div class="toolbar">
<div class="tool-group">
<button class="tool-btn" onclick="undo()" title="Отменить"><svg viewBox="0 0 24 24"><path d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62A7.47 7.47 0 0 1 12.5 10.5c3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/></svg></button>
<button class="tool-btn" onclick="redo()" title="Повторить"><svg viewBox="0 0 24 24"><path d="M18.4 10.6C16.55 8.99 14.15 8 11.5 8c-4.65 0-8.58 3.03-9.96 7.22L3.9 16c1.05-3.19 4.05-5.5 7.6-5.5 1.95 0 3.73.72 5.12 1.88L13 16h9V7l-3.6 3.6z"/></svg></button>
</div>
<div class="tool-group">
<button class="tool-btn" onclick="addShape('rect')" title="Прямоугольник"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/></svg></button>
<button class="tool-btn" onclick="addShape('circle')" title="Круг"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/></svg></button>

function playPixelRain(host,bg){
var cols=28,rows=16,ov=document.createElement('div');ov.className='pixel-rain';
var w=100/cols,h=100/rows;
for(var r=0;r<rows;r++)for(var c=0;c<cols;c++){

t.style.left=(c*w)+'%';t.style.top=(r*h)+'%';t.style.width=(w+.4)+'%';t.style.height=(h+.4)+'%';

}
function playPixelSwitch(host,newBg){
var ov=document.createElement('div');ov.className='t-overlay t-pixel-switch';
var cv=document.createElement('canvas');ov.appendChild(cv);host.appendChild(ov);
var W=cv.width=96,H=cv.height=54;
var ctx=cv.getContext('2d');
var cells=[];for(var i=0;i<W*H;i++)cells.push({done:false,t:Math.random()*600});
var start=performance.now(),dur=1100;
function frame(now){
var el=now-start;
ctx.clearRect(0,0,W,H);
var allDone=true;
for(var i=0;i<cells.length;i++){
var c=cells[i];
if(!c.done){
if(el>c.t){c.done=true;}
else{allDone=false;
if(Math.random()<0.08){ctx.fillStyle='rgb('+Math.floor(Math.random()*255)+','+Math.floor(Math.random()*255)+','+Math.floor(Math.random()*255)+')';}
else{ctx.fillStyle=Math.random()<0.5?'#111':'#eee';}
ctx.fillRect(i%W,Math.floor(i/W),1,1);continue;}
}
ctx.fillStyle=newBg;ctx.fillRect(i%W,Math.floor(i/W),1,1);
}
if(allDone){ov.style.opacity='0';setTimeout(function(){ov.remove();},200);}
else requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
}

    (msg?'<div class="toast-msg">'+escapeHtml(msg)+'</div>':'')+'</div>';

/* ============ HISTORY / STORAGE ============ */
function save(){
  // История — синхронно (для мгновенного undo/redo)
  hist=hist.slice(0,hi+1);
  hist.push(JSON.parse(JSON.stringify(slides)));
  hi++;
  if(hist.length>60){hist.shift();hi--;}
  // localStorage — асинхронно, с дебаунсом
  if(saveTimer) clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{
    try{
      localStorage.setItem('sc_data_v18',JSON.stringify(slides));
    }catch(e){
      console.warn('Ошибка сохранения:',e.message);
      if(e.name==='QuotaExceededError'){
        toast('Хранилище переполнено','Очистите старые презентации или экспортируйте в JSON','warn');
      }
    }
  },180);
}

function attachViewer(div,content,el){

function attachEditor(div,content,el){
div.onmousedown=e=>{
if(e.target.classList.contains('node')||e.target.classList.contains('resize-handle')||e.target.classList.contains('rotate-handle'))return;
if(pen)return;
if(el.type==='table'&&e.target.tagName==='TD'&&e.target.isContentEditable)return;
if(e.detail===2&&(el.type==='shape'||el.type==='path')){e.preventDefault();e.stopPropagation();startNodes(el.id);return;}
if(editNodesId===el.id&&e.target.tagName==='path'){
e.preventDefault();e.stopPropagation();
const svg=content.querySelector('svg'),pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;
const p=pt.matrixTransform(svg.getScreenCTM().inverse());
addNode(el,p.x+el.x,p.y+el.y);return;}
if(e.shiftKey){e.preventDefault();
if(sel.has(el.id)){sel.delete(el.id);if(selId===el.id)selId=sel.size?[...sel][0]:null;}
else{sel.add(el.id);selId=el.id;}
renderCanvas();renderProps();return;}
startDrag(e,el);
};
if(el.id===selId&&el.id!==editNodesId){
['nw','ne','sw','se'].forEach(p=>{const h=document.createElement('div');h.className='resize-handle '+p;h.onmousedown=e=>startRez(e,el,p);div.appendChild(h);});
const r=document.createElement('div');r.className='rotate-handle';r.onmousedown=e=>startRot(e,el);div.appendChild(r);

function wireTableEdit(content,el){
const t=content.querySelector('table');
t.querySelectorAll('td').forEach(td=>{
td.onmousedown=e=>{
if(td.isContentEditable)return;
cellSel={id:el.id,r:+td.dataset.r,c:+td.dataset.c};
t.querySelectorAll('td').forEach(x=>x.classList.remove('sel'));td.classList.add('sel');
renderProps();
if(e.detail<2){e.stopPropagation();startDrag(e,el);}
};
td.ondblclick=e=>{
e.stopPropagation();td.contentEditable='true';td.focus();
const r=+td.dataset.r,c=+td.dataset.c;
const rg=document.createRange();rg.selectNodeContents(td);
const s=getSelection();s.removeAllRanges();s.addRange(rg);
const fin=()=>{td.contentEditable='false';el.cells[r][c].text=td.innerText;save();renderCanvas();renderProps();};
td.onblur=fin;
td.onkeydown=ev=>{ev.stopPropagation();if(ev.key==='Escape'||ev.key==='Enter'){ev.preventDefault();td.blur();}};
};

/* ============ NODES ============ */
function shapeNodes(el){
if(el.type==='path')return el.points||[];
const x=el.x,y=el.y,w=el.w,h=el.h;
if(el.shape==='circle'){const p=[];for(let i=0;i<12;i++){const a=i*Math.PI/6;p.push({x:x+w/2+w/2*Math.cos(a),y:y+h/2+h/2*Math.sin(a)});}return p;}
if(el.shape==='triangle')return [{x:x+w/2,y:y},{x:x+w,y:y+h},{x:x,y:y+h}];
return [{x:x,y:y},{x:x+w,y:y},{x:x+w,y:y+h},{x:x,y:y+h}];
}
function toPath(el){
if(el.type==='path')return;
const pts=shapeNodes(el).map(p=>({x:p.x,y:p.y}));
const wasCircle=el.shape==='circle';
el.type='path';el.points=pts;el.closed=true;el.isCurve=wasCircle;
delete el.shape;recalcPath(el);
}
function renderNodes(div,el){
shapeNodes(el).forEach((p,i)=>{
const d=document.createElement('div');
d.className='node'+(p.rounded?' rounded':'')+(nodeIdx===i?' sel':'');
d.style.left=(p.x-el.x)+'px';d.style.top=(p.y-el.y)+'px';
d.onmousedown=e=>{e.stopPropagation();e.preventDefault();nodeIdx=i;renderCanvas();renderProps();dragNode(e,el,i);};
div.appendChild(d);});
}
function dragNode(e,el,i){
const rect=document.getElementById('slideCanvas').getBoundingClientRect();
const mv=ev=>{
if(el.type!=='path')toPath(el);
el.points[i].x=(ev.clientX-rect.left)/scale;el.points[i].y=(ev.clientY-rect.top)/scale;
recalcPath(el);renderCanvas();};
const up=()=>{document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);save();renderProps();};
document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up);
}
function addNode(el,x,y){
if(el.type!=='path')toPath(el);
let best=1,bd=1e9;
const n=el.points.length;
for(let i=0;i<(el.closed?n:n-1);i++){
const a=el.points[i],b=el.points[(i+1)%n];
const dx=b.x-a.x,dy=b.y-a.y,L=dx*dx+dy*dy;
let t=L?((x-a.x)*dx+(y-a.y)*dy)/L:0;t=clamp(t,0,1);
const d=Math.hypot(x-(a.x+t*dx),y-(a.y+t*dy));
if(d<bd){bd=d;best=i+1;}}
el.points.splice(best,0,{x:x,y:y});nodeIdx=best;recalcPath(el);save();renderCanvas();renderProps();
}
function delNode(){
const el=byId(editNodesId);if(!el||nodeIdx==null||el.type!=='path')return;
const min=el.closed?3:2;
if(el.points.length<=min){alert('Минимум '+min+' узла');return;}
el.points.splice(nodeIdx,1);nodeIdx=null;recalcPath(el);save();renderCanvas();renderProps();
}
function roundNode(){
const el=byId(editNodesId);if(!el||nodeIdx==null)return;
if(el.type!=='path')toPath(el);
el.points[nodeIdx].rounded=!el.points[nodeIdx].rounded;
save();renderCanvas();renderProps();
}
function startNodes(id){const el=byId(id);if(!el)return;editNodesId=id;selId=id;sel.clear();sel.add(id);nodeIdx=null;renderCanvas();renderProps();}
function stopNodes(){editNodesId=null;nodeIdx=null;renderCanvas();renderProps();}
function recalcPath(el){
if(!el.points||!el.points.length)return;
const xs=el.points.map(p=>p.x),ys=el.points.map(p=>p.y);
const pad=((el.style&&el.style.strokeWidth)||3)/2+4;
el.x=Math.min.apply(null,xs)-pad;el.y=Math.min.apply(null,ys)-pad;
el.w=Math.max.apply(null,xs)-Math.min.apply(null,xs)+pad*2;
el.h=Math.max.apply(null,ys)-Math.min.apply(null,ys)+pad*2;
}

function startPen(curve){

penCurve=curve;
const s=D(),bg=(s.bgColors&&s.bgColors[0])||s.bg||'#fff';

function penPoint(x,y){
if(!pen)return;
if(pen.points.length>2){const f=pen.points[0];
if(Math.hypot(f.x-x,f.y-y)<14){pen.closed=true;finishPen();return;}}
pen.points.push({x:x,y:y});recalcPath(pen);renderCanvas();
}
function finishPen(){
if(!pen){return;}

document.getElementById('penBtn').classList.remove('drawing-active');
document.getElementById('penCurveBtn').classList.remove('drawing-active');
document.getElementById('slideCanvas').classList.remove('drawing-cursor');
if(p.points.length<2){D().elements=D().elements.filter(e=>e.id!==p.id);renderCanvas();renderProps();return;}
recalcPath(p);
if(cropFor){
const img=byId(cropFor);
if(img){img.cropPath=elementPathD(p,img.x,img.y);img.mask=null;}
D().elements=D().elements.filter(e=>e.id!==p.id);
cropFor=null;selId=img?img.id:null;
}

}

function startDrag(e,el){

let list;
if(sel.size>1&&sel.has(el.id))list=[...sel].map(byId).filter(Boolean);
else{selId=el.id;sel.clear();sel.add(el.id);list=[el];}
drag={sx:e.clientX,sy:e.clientY,items:list.map(x=>({el:x,x:x.x,y:x.y,pts:x.points?JSON.parse(JSON.stringify(x.points)):null}))};

function startRez(e,el,pos){e.preventDefault();e.stopPropagation();
rez={el:el,pos:pos,sx:e.clientX,sy:e.clientY,x:el.x,y:el.y,w:el.w,h:el.h,pts:el.points?JSON.parse(JSON.stringify(el.points)):null};}
function startRot(e,el){e.preventDefault();e.stopPropagation();rot={el:el};}
document.addEventListener('mousemove',e=>{
if(magOn)magMove(e.clientX,e.clientY);
if((drag||rez||rot)&&e.buttons===0){drag=rez=rot=null;}
if(pan){offX=pan.ox+(e.clientX-pan.x);offY=pan.oy+(e.clientY-pan.y);
document.getElementById('canvasTransform').style.transform='translate('+offX+'px,'+offY+'px) scale('+scale+')';return;}
if(drag){wasDrag=true;
const dx=(e.clientX-drag.sx)/scale,dy=(e.clientY-drag.sy)/scale;
drag.items.forEach(it=>{it.el.x=it.x+dx;it.el.y=it.y+dy;
if(it.pts)it.el.points=it.pts.map(p=>Object.assign({},p,{x:p.x+dx,y:p.y+dy}));
const d=document.querySelector('[data-id="'+it.el.id+'"]');
if(d){d.style.left=it.el.x+'px';d.style.top=it.el.y+'px';}});}
if(rez){wasDrag=true;
const el=rez.el,dx=(e.clientX-rez.sx)/scale,dy=(e.clientY-rez.sy)/scale;
let w=rez.w,h=rez.h,x=rez.x,y=rez.y;
if(rez.pos.includes('e'))w=Math.max(20,rez.w+dx);
if(rez.pos.includes('s'))h=Math.max(20,rez.h+dy);
if(rez.pos.includes('w')){w=Math.max(20,rez.w-dx);x=rez.x+(rez.w-w);}
if(rez.pos.includes('n')){h=Math.max(20,rez.h-dy);y=rez.y+(rez.h-h);}
if(el.type==='path'&&rez.pts){
const sx=w/rez.w,sy=h/rez.h;
el.points=rez.pts.map(p=>Object.assign({},p,{x:x+(p.x-rez.x)*sx,y:y+(p.y-rez.y)*sy}));
el.x=x;el.y=y;el.w=w;el.h=h;
}else{el.x=x;el.y=y;el.w=w;el.h=h;}
renderCanvas();}
if(rot){wasDrag=true;
const el=rot.el,r=document.getElementById('slideCanvas').getBoundingClientRect();
const mx=(e.clientX-r.left)/scale,my=(e.clientY-r.top)/scale;
let a=Math.atan2(my-(el.y+el.h/2),mx-(el.x+el.w/2))*180/Math.PI+90;
if(e.shiftKey)a=Math.round(a/15)*15;
el.style=el.style||{};el.style.rotation=Math.round(a);
const d=document.querySelector('[data-id="'+el.id+'"]');if(d)d.style.transform='rotate('+a+'deg)';}
});

/* ============ ANIMATIONS (viewer runtime) ============ */
function runAnim(el,outer,content,ev){
const groups=animGroups(el.anims,ev);if(!groups.length)return;
if(!outer._an)outer._an={ptr:{},st:captureState(el)};
const A=outer._an;A.ptr[ev]=A.ptr[ev]||0;
if(A.ptr[ev]>=groups.length)return;
const g=groups[A.ptr[ev]];
g.forEach((a,i)=>{
setTimeout(()=>{
if(a.prop==='sound'){if(a.soundSrc){const au=new Audio(a.soundSrc);au.volume=a.soundVolume===undefined?1:a.soundVolume;liveSounds.push(au);au.play().catch(()=>{});}return;}
const st=Object.assign({},A.st);
if(a.prop==='xy'){st.x=+a.x||0;st.y=+a.y||0;}
else if(a.prop==='text'){st.text=a.text||'';}
else st[a.prop]=a.value;
A.st=st;applyAnimState(el,outer,content,st);
},animDelay(g,i));});
A.ptr[ev]++;
}

const ACTIONS=[['fill','Цвет заливки'],['stroke','Цвет контура'],['color','Цвет текста'],['backgroundColor','Цвет фона'],
['opacity','Прозрачность'],['scale','Масштаб'],['x','Позиция X'],['y','Позиция Y'],['xy','Перейти в X,Y'],['rotation','Поворот °'],
['text','Заменить текст на…'],['sound','Воспроизвести звук']];
const EVENTS=[['click','Клик'],['mousedown','Клавиша мыши нажата'],['mouseup','Клавиша мыши отпущена'],['hover','Наведение'],['mouseleave','Выведение'],['slideEnter','Появление слайда']];
function renderAnims(){
const el=curEl(),box=document.getElementById('anims');if(!el||!box)return;
const list=el.anims||[];
if(!list.length){box.innerHTML='<div class="hint">Шагов нет.</div>';return;}
box.innerHTML=list.map((a,i)=>{
const isColor=['fill','stroke','color','backgroundColor'].includes(a.prop);
let val='';
if(a.prop==='sound')val='<div class="prop-row"><label>URL:</label><input type="text" value="'+escapeHtml(a.soundSrc||'')+'" onchange="upAnim('+i+',\'soundSrc\',this.value)"></div>'+
'<div class="prop-row"><label>Файл:</label><input type="file" accept="audio/*" onchange="pickAnimSound(this,'+i+')"></div>';
else if(a.prop==='text')val='<div class="prop-row"><label>Текст:</label><input type="text" value="'+escapeHtml(a.text||'')+'" onchange="upAnim('+i+',\'text\',this.value)"></div>';
else if(a.prop==='xy')val='<div class="prop-row"><label>X:</label><input type="number" value="'+(a.x||0)+'" onchange="upAnim('+i+',\'x\',+this.value)"><label style="min-width:20px">Y:</label><input type="number" value="'+(a.y||0)+'" onchange="upAnim('+i+',\'y\',+this.value)"></div>';
else val='<div class="prop-row"><label>Значение:</label>'+(isColor?'<input type="color" value="'+toHexColor(a.value)+'" onchange="upAnim('+i+',\'value\',this.value)">':'<input type="number" step="0.1" value="'+a.value+'" onchange="upAnim('+i+',\'value\',+this.value)">')+'</div>';
return '<div class="anim-step"><div class="anim-head"><div class="anim-ctrl">'+
'<button onclick="moveAnim('+i+',-1)">▲</button><button onclick="moveAnim('+i+',1)">▼</button><button class="d" onclick="delAnim('+i+')">✕</button>'+
'</div><span class="anim-num">'+(i+1)+'</span></div>'+
'<div class="prop-row"><label>Событие:</label><select onchange="upAnim('+i+',\'trigger\',this.value)">'+EVENTS.map(e=>'<option value="'+e[0]+'"'+((a.trigger||'click')===e[0]?' selected':'')+'>'+e[1]+'</option>').join('')+'</select></div>'+
'<div class="prop-row"><label>Запуск:</label><select onchange="upAnim('+i+',\'mode\',this.value)">'+[['alone','Отдельно'],['together','Вместе с пред.'],['cascade','Каскадом']].map(m=>'<option value="'+m[0]+'"'+((a.mode||'alone')===m[0]?' selected':'')+'>'+m[1]+'</option>').join('')+'</select></div>'+
'<div class="prop-row"><label>Действие:</label><select onchange="changeAction('+i+',this.value)">'+ACTIONS.map(o=>'<option value="'+o[0]+'"'+(a.prop===o[0]?' selected':'')+'>'+o[1]+'</option>').join('')+'</select></div>'+val+'</div>';
}).join('');
}
function addAnim(){const el=curEl();if(!el)return;el.anims=el.anims||[];
el.anims.push({trigger:'click',mode:'alone',prop:el.type==='text'?'color':'fill',value:'#f59e0b'});save();renderAnims();}
function delAnim(i){const el=curEl();el.anims.splice(i,1);save();renderAnims();}
function moveAnim(i,d){const el=curEl(),j=i+d;if(j<0||j>=el.anims.length)return;
const t=el.anims[i];el.anims[i]=el.anims[j];el.anims[j]=t;save();renderAnims();}
function upAnim(i,k,v){const el=curEl();el.anims[i][k]=v;save();}
function changeAction(i,v){const el=curEl(),a=el.anims[i];a.prop=v;
if(v==='sound')a.soundSrc=a.soundSrc||'';
else if(v==='text')a.text=a.text||'Новый текст';
else if(v==='xy'){a.x=Math.round(el.x);a.y=Math.round(el.y);}
else if(['fill','stroke','color','backgroundColor'].includes(v))a.value='#f59e0b';
else a.value=(v==='opacity'?1:(v==='scale'?1.2:0));
save();renderAnims();}
function pickAnimSound(inp,i){if(!inp.files[0])return;
const f=inp.files[0];
const t=toast('Загрузка аудио',f.name,'',{spinner:true,persist:true});
readFileAsync(f).then(d=>{upAnim(i,'soundSrc',d);renderAnims();t.remove();toast('Готово','Аудио загружено','success');})
.catch(err=>{t.remove();toast('Ошибка',err.message,'error');});
}

  const t=toast('Загрузка файла',f.name+' ('+sizeMB.toFixed(1)+' МБ). Можно работать с другими слайдами.','',{spinner:true,persist:true});

    el.src=d;save();scheduleRender();

  readFileAsync(f).then(d=>{el.src=d;save();scheduleRender();t.remove();}).catch(err=>{t.remove();alert(err.message);});
}
}

function maskList(el){

.map(e=>({id:e.id,label:(e.type==='path'?'✏️ Контур':(e.shape==='circle'?'⚫ Круг':e.shape==='triangle'?'△ Треуг.':'▬ Прямоуг.'))+' #'+e.id.slice(-4)}));}
function setMask(id){
const el=curEl();if(!el)return;
if(el.mask){const p=byId(el.mask);if(p)p.hidden=false;}
if(id){el.mask=id;el.cropPath=null;const m=byId(id);if(m)m.hidden=true;}
else delete el.mask;
save();renderAll();
}

function layer(dir){const s=D(),i=s.elements.findIndex(e=>e.id===selId);if(i<0)return;
const el=s.elements.splice(i,1)[0];
if(dir==='top')s.elements.push(el);else if(dir==='bottom')s.elements.unshift(el);
else if(dir==='up')s.elements.splice(Math.min(i+1,s.elements.length),0,el);else s.elements.splice(Math.max(i-1,0),0,el);
save();renderAll();}

stopBg();bgAudio=new Audio(s.audioUrl);bgAudio.loop=!!s.audioLoop;bgAudio.volume=s.audioVolume===undefined?1:s.audioVolume;

var c=document.createElement('div');c.className='element-content';
if(e.type==='text'||e.type==='math'){
c.classList.add('text-el');c.innerHTML=e.content||'';
c.style.fontSize=(st.fontSize||20)+'px';c.style.fontFamily=st.fontFamily||'Arial';
c.style.fontWeight=st.fontWeight||'normal';c.style.fontStyle=st.fontStyle||'normal';
c.style.textDecoration=st.textDecoration||'none';c.style.color=st.color||'#1a1d24';
c.style.textAlign=st.textAlign||'left';c.style.lineHeight=st.lineHeight||1.4;
if(st.backgroundColor&&st.backgroundColor!=='transparent')c.style.backgroundColor=st.backgroundColor;
if(st.blurBackground){c.classList.add('blur-bg');
var hx=toHexColor(st.blurColor||'#ffffff'),o=st.blurOpacity===undefined?.75:st.blurOpacity;
c.style.backgroundColor='rgba('+parseInt(hx.substr(1,2),16)+','+parseInt(hx.substr(3,2),16)+','+parseInt(hx.substr(5,2),16)+','+o+')';
if(st.blurBorderWidth>0)c.style.border=st.blurBorderWidth+'px solid '+(st.blurBorderColor||'#fff');}
}else if(e.type==='shape')c.appendChild(buildShapeSVG(e));
else if(e.type==='path')c.appendChild(buildPathSVG(e));
else if(e.type==='image'){var im=document.createElement('img');im.src=e.src||'';im.style.cssText='width:100%;height:100%;display:block;object-fit:'+(e.fit||'cover')+';border-radius:'+(st.borderRadius||0)+'px';c.appendChild(im);}
else if(e.type==='gif'){var g=document.createElement('img');g.src=e.src||'';g.style.cssText='width:100%;height:100%;object-fit:contain;display:block';c.appendChild(g);}
else if(e.type==='video'){
  if(e.embedCode){
    var wrap=document.createElement('div');
    wrap.style.cssText='width:100%;height:100%;position:relative;background:#000';
    wrap.innerHTML=e.embedCode;
    var iframe=wrap.querySelector('iframe');
    if(iframe){iframe.style.cssText='width:100%;height:100%;border:0';iframe.setAttribute('allowfullscreen','');}
    c.appendChild(wrap);
  } else {
    var v=document.createElement('video');v.src=e.src||'';v.controls=true;v.style.cssText='width:100%;height:100%;object-fit:contain;background:#000';v.onclick=function(ev){ev.stopPropagation();};c.appendChild(v);
  }
}
else if(e.type==='chart')c.appendChild(buildChartSVG(e));
else if(e.type==='table'){c.classList.add('table-el');c.innerHTML=buildTableHTML(e);wireTableHover(c);}
else if(e.type==='button'){var b=document.createElement('button');b.className='btn-el';b.textContent=e.text||'Кнопка';
b.style.cssText='background:'+(e.bg||'#6366f1')+';color:'+(e.color||'#fff')+';font-size:'+(e.fontSize||16)+'px;border-radius:'+(e.borderRadius||6)+'px;border:'+(e.borderWidth>0?e.borderWidth+'px solid '+(e.borderColor||'#fff'):'none');
b.onclick=function(ev){ev.stopPropagation();act(e);};c.appendChild(b);}
var m=null;(s.elements||[]).forEach(function(x){if(x.id===e.mask)m=x;});
applyClip(c,e,(m&&!m.hidden)?m:(e.cropPath?null:m));
d.appendChild(c);
if(e.type!=='video'&&e.type!=='button'){
d.addEventListener('mouseenter',function(){run(e,d,c,'hover');});
d.addEventListener('mouseleave',function(){run(e,d,c,'mouseleave');});
d.addEventListener('mousedown',function(ev){ev.stopPropagation();run(e,d,c,'mousedown');});
d.addEventListener('mouseup',function(ev){ev.stopPropagation();run(e,d,c,'mouseup');});

}
inner.appendChild(d);
});
host.appendChild(inner);
el('cnt').textContent=(idx+1)+' / '+SLIDES.length;
el('nav').style.display=SET.lockNavigation?'none':'flex';
}
function run(e,d,c,ev){
var gs=animGroups(e.anims,ev);if(!gs.length)return;
if(!d._an)d._an={ptr:{},st:captureState(e)};
var A=d._an;A.ptr[ev]=A.ptr[ev]||0;
if(A.ptr[ev]>=gs.length)return;
var g=gs[A.ptr[ev]];
g.forEach(function(a,i){setTimeout(function(){
if(a.prop==='sound'){if(a.soundSrc){var au=new Audio(a.soundSrc);sounds.push(au);au.play().catch(function(){});}return;}
var st={};for(var k in A.st)st[k]=A.st[k];
if(a.prop==='xy'){st.x=+a.x||0;st.y=+a.y||0;}
else if(a.prop==='text')st.text=a.text||'';
else st[a.prop]=a.value;
A.st=st;applyAnimState(e,d,c,st);},animDelay(g,i));});
A.ptr[ev]++;
}
function act(e){
if(e.actionType==='slide'){var t=parseInt(e.actionTarget)||0;if(t>=0&&t<SLIDES.length){idx=t;render();changed();}}
else if(e.url)window.open(e.url,'_blank');
}
function audio(){
var s=SLIDES[idx];
if(!s.audioUrl){if(bg)fade();return;}
if(bgU===s.audioUrl&&bg){bg.loop=!!s.audioLoop;bg.volume=s.audioVolume===undefined?1:s.audioVolume;return;}
stop();bg=new Audio(s.audioUrl);bg.loop=!!s.audioLoop;bg.volume=s.audioVolume===undefined?1:s.audioVolume;
bg.play().catch(function(){});bgU=s.audioUrl;
}
function fade(){if(!bg)return;var a=bg,v=a.volume,i=0;
var t=setInterval(function(){i++;if(bg)bg.volume=Math.max(0,v*(1-i/20));if(i>=20){clearInterval(t);a.pause();if(bg===a){bg=null;bgU=null;}}},25);}
function stop(){if(bg){bg.pause();bg=null;bgU=null;}}
function stopAll(){stop();sounds.forEach(function(a){try{a.pause();}catch(e){}});sounds=[];}
function changed(){
var s=SLIDES[idx];audio();
var host=el('slide');
var oldBg=s.prevBg||'#0a0b0f';s.prevBg=slideBgCSS(s);
animateHost(host,s.transition||'none',oldBg,slideBgCSS(s));
setTimeout(function(){(s.elements||[]).forEach(function(e){
var d=host.querySelector('[data-id="'+e.id+'"]');if(!d)return;
run(e,d,d.querySelector('.element-content'),'slideEnter');});},60);
auto();
}
window.prev=function(){if(SET.lockNavigation)return;if(idx>0){idx--;render();changed();}};
window.next=function(){if(SET.lockNavigation)return;if(idx<SLIDES.length-1){idx++;render();changed();}};
window.toggleFS=function(){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(function(){});};
window.closePres=function(){stopAll();if(document.fullscreenElement)document.exitFullscreen();
document.body.innerHTML='<div style="color:#fff;text-align:center;padding:60px;font-family:sans-serif">Презентация завершена</div>';};
function auto(){if(timer)clearInterval(timer);
if(SET.autoAdvanceTime>0&&!SET.lockNavigation)timer=setInterval(function(){idx<SLIDES.length-1?next():closePres();},SET.autoAdvanceTime*1000);}
document.addEventListener('keydown',function(e){
if(e.key==='Escape'){closePres();return;}
if(SET.lockNavigation||!SET.navKeyboard)return;
if(e.key==='ArrowLeft')prev();if(e.key==='ArrowRight')next();
if(e.key===' '&&SET.navSpace){e.preventDefault();next();}});
el('wrap').addEventListener('click',function(e){
if(e.target.closest('.element'))return;
if(SET.navMouse&&!SET.lockNavigation)next();});
window.addEventListener('resize',render);
window.addEventListener('beforeunload',stopAll);
render();changed();
}
/* ============ KEYBOARD ============ */
document.addEventListener('keydown',e=>{
const presOn=document.getElementById('presMode').classList.contains('active');
if(document.getElementById('modal').classList.contains('active')){if(e.key==='Escape')closeModal();return;}
const ae=document.activeElement;
if(ae&&(ae.isContentEditable||['INPUT','TEXTAREA','SELECT'].includes(ae.tagName)))return;
if(e.ctrlKey&&e.key.toLowerCase()==='z'){e.preventDefault();undo();return;}
if(e.ctrlKey&&(e.key.toLowerCase()==='y'||(e.shiftKey&&e.key.toLowerCase()==='z'))){e.preventDefault();redo();return;}
if(e.ctrlKey&&e.key.toLowerCase()==='c'){e.preventDefault();copySel();return;}
if(e.ctrlKey&&e.key.toLowerCase()==='v'){e.preventDefault();pasteSel();return;}
if(e.key==='F5'){e.preventDefault();presOn?stopPres():startPres();return;}
if(e.key==='Escape'){
if(presOn)stopPres();
else if(pen)finishPen();
else if(editNodesId)stopNodes();
else if(cropFor){cropFor=null;renderProps();}
else{clearSel();renderCanvas();renderProps();}
return;}
if(presOn){
if(e.key==='ArrowLeft'&&presSettings.navKeyboard)presPrev();
if(e.key==='ArrowRight'&&presSettings.navKeyboard)presNext();
if(e.key===' '&&presSettings.navSpace){e.preventDefault();presNext();}
return;}
if(e.key==='ArrowLeft')prevSlide();
if(e.key==='ArrowRight')nextSlide();
if(e.key==='Delete'||e.key==='Backspace'){
e.preventDefault();
if(editNodesId&&nodeIdx!=null)delNode();
else if(sel.size>1)delSel();
else if(selId)delEl();}
});
/* ============ INIT ============ */
load();applyA11y();renderAll();
</script>
